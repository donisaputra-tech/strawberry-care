<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deteksi Penyakit Daun Stroberi</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background-color: #fff5f5;
      font-family: "Poppins", sans-serif;
    }

    .upload-section {
      background: #fff;
      border: 2px dashed #e63946;
      border-radius: 15px;
      padding: 40px;
      text-align: center;
      transition: all 0.3s ease;
    }

    .upload-section:hover {
      background-color: #fff0f0;
      box-shadow: 0 0 15px rgba(230, 57, 70, 0.2);
    }

    .upload-icon {
      font-size: 60px;
      color: #e63946;
    }

    .btn-strawberry {
      background-color: #e63946;
      color: #fff;
      border: none;
      transition: 0.3s;
    }

    .btn-strawberry:hover {
      background-color: #c92a3a;
    }

    .result-card {
      margin-top: 30px;
      background: #fff;
      border: 1px solid #f8c6c6;
      border-radius: 10px;
      padding: 20px;
      display: none;
    }

    .result-card h5 {
      color: #d32f2f;
    }
  </style>
</head>
<body>
  <!-- ==================== NAVBAR ==================== -->
  <nav class="navbar navbar-expand-lg shadow-sm" style="background-color: #d32f2f;">
    <div class="container px-5">
      <a class="navbar-brand fw-bold text-white" href="index.html">🍓 DETEKSI DAUN STROBERI</a>
      <button class="navbar-toggler border-0" type="button" data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link fw-semibold text-white" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-white" href="about.html">Penyakit</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-white" href="contact.html">Deteksi</a></li>
          <li class="nav-item"><a class="nav-link fw-semibold text-white" href="login.html">Login</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- ==================== HEADER ==================== -->
  <header class="py-4 text-center bg-white shadow-sm mb-4">
    <h2 class="fw-bold text-danger">🍓 Deteksi Penyakit Daun Stroberi</h2>
    <p class="text-muted">Unggah gambar daun stroberi untuk mendeteksi jenis penyakitnya.</p>
  </header>

  <!-- ==================== UPLOAD SECTION ==================== -->
  <div class="container py-5">
    <div class="upload-section mx-auto" style="max-width: 600px;">
      <div class="upload-icon mb-3">📸</div>
      <h5 class="fw-bold mb-3 text-danger">Unggah Gambar Daun Stroberi</h5>

     <form id="uploadForm" enctype="multipart/form-data">
  <input type="file" name="image" id="imageUpload" class="form-control mb-3" accept="image/*" required>
  <button type="submit" class="btn btn-strawberry btn-lg px-4">Deteksi Sekarang</button>
</form>

<div id="result" class="mt-4 text-center fw-bold text-danger"></div>

<script>
document.getElementById("uploadForm").addEventListener("submit", async function(e) {
  e.preventDefault();
  const formData = new FormData(this);

  const res = await fetch("/predict", {
    method: "POST",
    body: formData
  });

  const data = await res.json();
  document.getElementById("result").innerHTML =
    data.error ? data.error : data.pesan;
});
</script>


      <!-- Hasil Deteksi -->
      <div id="resultCard" class="result-card">
        <h5 class="fw-bold">Hasil Deteksi:</h5>
        <p id="predictionText"></p>
        <img id="previewImage" src="#" alt="Preview" class="img-fluid rounded mt-3" style="max-height: 250px; display: none;">
      </div>
    </div>
  </div>

  <script>
    document.getElementById("uploadForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const fileInput = document.getElementById("imageUpload");
      const formData = new FormData();
      formData.append("image", fileInput.files[0]);

      const response = await fetch("http://127.0.0.1:5000/predict", {
        method: "POST",
        body: formData
      });

      const result = await response.json();

      // Tampilkan hasil
      document.getElementById("resultCard").style.display = "block";
      document.getElementById("predictionText").innerHTML =
        `<strong>${result.prediction}</strong> (${result.confidence})`;

      // Preview gambar
      const reader = new FileReader();
      reader.onload = function(e) {
        const img = document.getElementById("previewImage");
        img.src = e.target.result;
        img.style.display = "block";
      };
      reader.readAsDataURL(fileInput.files[0]);
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
